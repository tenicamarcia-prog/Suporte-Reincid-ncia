<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Processo de Abertura</title>
<style>
:root{--bg:#07131f;--card:#0d1f30;--line:#21425e;--txt:#eef6ff;--muted:#afc5d8;--blue:#175c96;--red:#e33b3b}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);background:#081724;position:sticky;top:0;z-index:10}
h1{font-size:1.05rem;margin:0} a.btn{color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--blue),var(--red));padding:10px 14px;border-radius:10px;font-weight:700}
.wrap{padding:12px;height:calc(100vh - 67px)} iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:14px;background:#fff}
.note{position:fixed;left:18px;bottom:16px;background:#0b2030;border:1px solid var(--line);padding:10px 12px;border-radius:10px;color:var(--muted);font-size:.85rem;max-width:520px}
</style>
</head>
<body>
<header>
  <h1>Processo de Abertura</h1>
  <a class="btn" href="https://processo-de-abertura.vercel.app/" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
</header>
<div class="wrap">
  <iframe src="https://processo-de-abertura.vercel.app/" title="Processo de Abertura" loading="eager"></iframe>
</div>
<div class="note">Se o site não aparecer dentro da página, use “Abrir em nova aba”. Alguns sites bloqueiam carregamento dentro de iframe.</div>
</body>
</html>
